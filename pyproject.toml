[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repocompass"
version = "0.1.0"
description = "Know a repo before you contribute: where newcomers have historically had the best chance."
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sachith Reddy" }]
dependencies = [
    "fastapi>=0.162",
    "httpx>=0.28",
    "psycopg[binary]>=3.3",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.17"]

[project.scripts]
repocompass = "repocompass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repocompass = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["spikes", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201"]
